<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" fill="none">
  <title>CommandCenter perspective data floor</title>
  <defs>
    <linearGradient id="fadeUp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220" stop-opacity="0"/>
      <stop offset=".55" stop-color="#0b1220" stop-opacity=".55"/>
      <stop offset="1" stop-color="#04060c" stop-opacity=".96"/>
    </linearGradient>
    <linearGradient id="lineFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".05"/>
      <stop offset=".35" stop-color="#22d3ee" stop-opacity=".45"/>
      <stop offset="1" stop-color="#a3e635" stop-opacity=".20"/>
    </linearGradient>
    <radialGradient id="horizon" cx=".5" cy="0" r=".75">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".38"/>
      <stop offset=".55" stop-color="#0e7490" stop-opacity=".10"/>
      <stop offset="1" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <filter id="fglow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- horizon bloom -->
  <ellipse cx="800" cy="10" rx="820" ry="150" fill="url(#horizon)"/>

  <!-- converging vertical lines -->
  <g stroke="url(#lineFade)" stroke-width="1.1">
    <path d="M800 0 90 520" opacity=".45"/>
    <path d="M800 0 214 520"/>
    <path d="M800 0 338 520" opacity=".7"/>
    <path d="M800 0 462 520" opacity=".85"/>
    <path d="M800 0 586 520"/>
    <path d="M800 0 700 520" opacity=".8"/>
    <path d="M800 0 900 520" opacity=".8"/>
    <path d="M800 0 1014 520"/>
    <path d="M800 0 1138 520" opacity=".85"/>
    <path d="M800 0 1262 520" opacity=".7"/>
    <path d="M800 0 1386 520"/>
    <path d="M800 0 1510 520" opacity=".45"/>
  </g>

  <!-- horizontal depth bands -->
  <g stroke="#22d3ee" stroke-width="1">
    <path d="M60 40h1480" stroke-opacity=".30"/>
    <path d="M75 78h1450" stroke-opacity=".26"/>
    <path d="M96 126h1408" stroke-opacity=".22"/>
    <path d="M124 186h1352" stroke-opacity=".19"/>
    <path d="M162 262h1276" stroke-opacity=".16"/>
    <path d="M212 356h1176" stroke-opacity=".13"/>
    <path d="M276 470h1048" stroke-opacity=".10"/>
  </g>
  <g stroke="#a3e635" stroke-width="1.4" stroke-opacity=".22">
    <path d="M124 186h1352"/>
    <path d="M276 470h1048"/>
  </g>

  <!-- data packets travelling the floor -->
  <g filter="url(#fglow)">
    <rect x="700" y="124" width="34" height="3" rx="1.5" fill="#22d3ee" fill-opacity=".9"/>
    <rect x="1180" y="260" width="26" height="3" rx="1.5" fill="#a3e635" fill-opacity=".8"/>
    <rect x="330" y="354" width="30" height="3" rx="1.5" fill="#a855f7" fill-opacity=".85"/>
    <rect x="900" y="468" width="40" height="3" rx="1.5" fill="#22d3ee" fill-opacity=".7"/>
  </g>

  <rect width="1600" height="520" fill="url(#fadeUp)"/>
</svg>
