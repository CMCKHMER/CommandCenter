<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bg)"/>
  <!-- Flashcards -->
  <rect x="118" y="100" width="125" height="90" rx="5" fill="#1e3a5f" stroke="#0ea5e9" stroke-width="2"/>
  <!-- Card content -->
  <text x="180" y="152" font-family="sans-serif" font-size="28" font-weight="bold" fill="#06b6d4" text-anchor="middle" opacity="0.9">Bb</text>
  <line x1="132" y1="163" x2="230" y2="163" stroke="#bae6fd" stroke-width="1.5" opacity="0.5"/>
  <text x="180" y="175" font-family="sans-serif" font-size="9" fill="#bae6fd" text-anchor="middle" opacity="0.5">review word</text>
  <!-- Circular refresh arrow -->
  <path d="M285,100 Q340,80 340,130 Q340,180 285,180" fill="none" stroke="#14b8a6" stroke-width="5" stroke-linecap="round"/>
  <polygon points="282,98 294,88 296,104" fill="#14b8a6"/>
  <path d="M115,140 Q65,120 65,145 Q65,175 115,165" fill="none" stroke="#0891b2" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <polygon points="118,162 106,172 104,155" fill="#0891b2" opacity="0.6"/>
  <!-- Checkmark on refresh -->
  <circle cx="340" cy="130" r="18" fill="#14b8a6" opacity="0.25"/>
  <text x="340" y="137" font-family="sans-serif" font-size="18" fill="#34d399" text-anchor="middle" font-weight="bold">✓</text>
  <!-- Scattered mini cards -->
  <rect x="55" y="60" width="55" height="38" rx="3" fill="#0e2a4a" stroke="#0891b2" stroke-width="1" opacity="0.6"/>
  <text x="82" y="84" font-family="sans-serif" font-size="16" fill="#06b6d4" text-anchor="middle" opacity="0.7">Cc</text>
  <rect x="295" y="55" width="55" height="38" rx="3" fill="#0e2a4a" stroke="#0891b2" stroke-width="1" opacity="0.6"/>
  <text x="322" y="79" font-family="sans-serif" font-size="16" fill="#14b8a6" text-anchor="middle" opacity="0.7">Dd</text>
  <!-- Label -->
  <rect x="10" y="10" width="150" height="28" rx="8" fill="#14b8a6" opacity="0.8"/>
  <text x="80" y="29" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">Word Review</text>
</svg>
