<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="docGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0c2340"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bg)"/>
  <!-- Back docs -->
  <rect x="115" y="60" width="110" height="150" rx="5" fill="#0c2340" stroke="#0891b2" stroke-width="1"/>
  <rect x="105" y="50" width="110" height="150" rx="5" fill="#0e2a4a" stroke="#0891b2" stroke-width="1"/>
  <!-- Front main doc -->
  <rect x="130" y="40" width="110" height="150" rx="5" fill="url(#docGrad)" stroke="#0ea5e9" stroke-width="2"/>
  <!-- Folded corner -->
  <polygon points="240,40 240,68 212,40" fill="#0891b2" opacity="0.8"/>
  <polygon points="240,68 212,40 212,68" fill="#0c2340"/>
  <!-- Lines -->
  <line x1="145" y1="72" x2="225" y2="72" stroke="#bae6fd" stroke-width="1.5" opacity="0.6"/>
  <line x1="145" y1="85" x2="225" y2="85" stroke="#bae6fd" stroke-width="1.5" opacity="0.5"/>
  <line x1="145" y1="98" x2="225" y2="98" stroke="#bae6fd" stroke-width="1.5" opacity="0.5"/>
  <line x1="145" y1="111" x2="215" y2="111" stroke="#bae6fd" stroke-width="1.5" opacity="0.5"/>
  <!-- PDF ribbon -->
  <rect x="138" y="125" width="74" height="26" rx="4" fill="#f87171" opacity="0.9"/>
  <text x="175" y="143" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">PDF</text>
  <!-- Lines below ribbon -->
  <line x1="145" y1="162" x2="225" y2="162" stroke="#bae6fd" stroke-width="1.5" opacity="0.4"/>
  <line x1="145" y1="172" x2="210" y2="172" stroke="#bae6fd" stroke-width="1.5" opacity="0.4"/>
  <!-- Label -->
  <rect x="10" y="10" width="120" height="28" rx="8" fill="#f87171" opacity="0.8"/>
  <text x="70" y="29" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">PDF Documents</text>
</svg>
