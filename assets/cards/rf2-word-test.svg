<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bg)"/>
  <!-- Main flashcard -->
  <rect x="110" y="45" width="180" height="110" rx="7" fill="#1e3a5f" stroke="#0ea5e9" stroke-width="2"/>
  <!-- Question mark on card -->
  <text x="200" y="115" font-family="sans-serif" font-size="60" font-weight="bold" fill="#06b6d4" text-anchor="middle" opacity="0.8">?</text>
  <line x1="123" y1="70" x2="277" y2="70" stroke="#bae6fd" stroke-width="1.5" opacity="0.4"/>
  <text x="200" y="63" font-family="sans-serif" font-size="9" fill="#bae6fd" text-anchor="middle" opacity="0.5">What does this word mean?</text>
  <!-- A/B/C/D answer bubbles -->
  <circle cx="120" cy="185" r="20" fill="#0891b2" opacity="0.8"/>
  <text x="120" y="191" font-family="sans-serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">A</text>
  <circle cx="175" cy="185" r="20" fill="#14b8a6" opacity="0.8"/>
  <text x="175" y="191" font-family="sans-serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">B</text>
  <circle cx="230" cy="185" r="20" fill="#fbbf24" opacity="0.8"/>
  <text x="230" y="191" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">C</text>
  <circle cx="285" cy="185" r="20" fill="#f59e0b" opacity="0.8"/>
  <text x="285" y="191" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">D</text>
  <!-- Answer lines next to bubbles -->
  <line x1="143" y1="181" x2="168" y2="181" stroke="#bae6fd" stroke-width="1.5" opacity="0.4"/>
  <line x1="143" y1="188" x2="165" y2="188" stroke="#bae6fd" stroke-width="1.5" opacity="0.4"/>
  <line x1="198" y1="181" x2="223" y2="181" stroke="#bae6fd" stroke-width="1.5" opacity="0.4"/>
  <!-- Scattered letters -->
  <text x="55" y="80" font-family="sans-serif" font-size="24" fill="#0891b2" opacity="0.2" font-weight="bold">W</text>
  <text x="330" y="90" font-family="sans-serif" font-size="22" fill="#14b8a6" opacity="0.2" font-weight="bold">D</text>
  <text x="55" y="170" font-family="sans-serif" font-size="20" fill="#fbbf24" opacity="0.2" font-weight="bold">V</text>
  <text x="340" y="165" font-family="sans-serif" font-size="22" fill="#06b6d4" opacity="0.2" font-weight="bold">K</text>
  <!-- Label -->
  <rect x="10" y="10" width="130" height="28" rx="8" fill="#0891b2" opacity="0.75"/>
  <text x="75" y="29" font-family="sans-serif" font-size="13" font-weight="bold" fill="#e0f7ff" text-anchor="middle">Word Test</text>
</svg>
