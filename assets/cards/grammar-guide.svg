<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bg)"/>
  <!-- Open book left page -->
  <rect x="80" y="55" width="110" height="145" rx="4" fill="url(#bookGrad)" opacity="0.85"/>
  <!-- Open book right page -->
  <rect x="210" y="55" width="110" height="145" rx="4" fill="#1e3a5f" stroke="#0891b2" stroke-width="1.5"/>
  <!-- Spine -->
  <rect x="188" y="55" width="22" height="145" rx="2" fill="#0369a1"/>
  <!-- Big "Aa" on left page -->
  <text x="135" y="150" font-family="sans-serif" font-size="68" font-weight="bold" fill="#fff" text-anchor="middle" opacity="0.9">Aa</text>
  <!-- Punctuation floating -->
  <text x="260" y="100" font-family="sans-serif" font-size="28" fill="#fbbf24" text-anchor="middle" opacity="0.9">,</text>
  <text x="310" y="80" font-family="sans-serif" font-size="24" fill="#06b6d4" text-anchor="middle" opacity="0.9">?</text>
  <text x="240" y="145" font-family="sans-serif" font-size="22" fill="#34d399" text-anchor="middle" opacity="0.9">!</text>
  <text x="305" y="140" font-family="sans-serif" font-size="18" fill="#f472b6" text-anchor="middle" opacity="0.9">.</text>
  <text x="340" y="115" font-family="sans-serif" font-size="20" fill="#a78bfa" text-anchor="middle" opacity="0.9">;</text>
  <!-- Grammar rule ribbon -->
  <rect x="200" y="165" width="130" height="25" rx="5" fill="#fbbf24" opacity="0.85"/>
  <text x="265" y="182" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">Subject + Verb + Object</text>
  <!-- Lines on right page -->
  <line x1="220" y1="75" x2="310" y2="75" stroke="#bae6fd" stroke-width="1.5" opacity="0.5"/>
  <line x1="220" y1="90" x2="310" y2="90" stroke="#bae6fd" stroke-width="1.5" opacity="0.5"/>
  <line x1="220" y1="105" x2="300" y2="105" stroke="#bae6fd" stroke-width="1.5" opacity="0.5"/>
  <!-- Label -->
  <rect x="10" y="10" width="155" height="28" rx="8" fill="#0891b2" opacity="0.75"/>
  <text x="87" y="29" font-family="sans-serif" font-size="13" font-weight="bold" fill="#e0f7ff" text-anchor="middle">Grammar Guide</text>
</svg>
