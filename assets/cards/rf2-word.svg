<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bg)"/>
  <!-- Fanned flashcards -->
  <rect x="130" y="105" width="120" height="90" rx="5" fill="#0c2340" stroke="#0369a1" stroke-width="1.5" transform="rotate(-18 190 150)"/>
  <rect x="130" y="105" width="120" height="90" rx="5" fill="#0e2a4a" stroke="#0891b2" stroke-width="1.5" transform="rotate(-9 190 150)"/>
  <rect x="130" y="105" width="120" height="90" rx="5" fill="#1e3a5f" stroke="#0ea5e9" stroke-width="2"/>
  <!-- Letters on front card -->
  <text x="190" y="160" font-family="sans-serif" font-size="36" font-weight="bold" fill="#06b6d4" text-anchor="middle" opacity="0.9">Aa</text>
  <line x1="145" y1="172" x2="235" y2="172" stroke="#bae6fd" stroke-width="1.5" opacity="0.5"/>
  <text x="190" y="184" font-family="sans-serif" font-size="10" fill="#bae6fd" text-anchor="middle" opacity="0.6">vocabulary</text>
  <!-- Scattered letters in background -->
  <text x="50" y="80" font-family="sans-serif" font-size="28" fill="#0891b2" opacity="0.35" font-weight="bold">B</text>
  <text x="320" y="70" font-family="sans-serif" font-size="24" fill="#14b8a6" opacity="0.35" font-weight="bold">Z</text>
  <text x="55" y="190" font-family="sans-serif" font-size="22" fill="#06b6d4" opacity="0.3" font-weight="bold">M</text>
  <text x="330" y="185" font-family="sans-serif" font-size="26" fill="#0ea5e9" opacity="0.3" font-weight="bold">W</text>
  <text x="300" y="140" font-family="sans-serif" font-size="20" fill="#fbbf24" opacity="0.25" font-weight="bold">X</text>
  <text x="70" y="140" font-family="sans-serif" font-size="18" fill="#fbbf24" opacity="0.25" font-weight="bold">Q</text>
  <!-- Label -->
  <rect x="10" y="10" width="100" height="28" rx="8" fill="#0891b2" opacity="0.75"/>
  <text x="60" y="29" font-family="sans-serif" font-size="13" font-weight="bold" fill="#e0f7ff" text-anchor="middle">Word</text>
</svg>
