<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="book1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bg)"/>
  <!-- Stack of books -->
  <rect x="85" y="165" width="130" height="22" rx="3" fill="#0d9488"/>
  <rect x="90" y="148" width="120" height="20" rx="3" fill="#0891b2"/>
  <rect x="95" y="131" width="110" height="20" rx="3" fill="#0ea5e9"/>
  <rect x="100" y="115" width="100" height="20" rx="3" fill="#06b6d4"/>
  <!-- Book spines details -->
  <rect x="85" y="165" width="8" height="22" rx="1" fill="#0a7a6b"/>
  <rect x="90" y="148" width="8" height="20" rx="1" fill="#0774a0"/>
  <rect x="95" y="131" width="8" height="20" rx="1" fill="#0284c7"/>
  <rect x="100" y="115" width="8" height="20" rx="1" fill="#0369a1"/>
  <!-- Bookmark -->
  <polygon points="148,80 148,115 155,110 162,115 162,80" fill="#f59e0b"/>
  <!-- Magnifier -->
  <circle cx="290" cy="130" r="35" fill="none" stroke="#06b6d4" stroke-width="5"/>
  <circle cx="290" cy="130" r="30" fill="#0c2340" opacity="0.8"/>
  <line x1="315" y1="155" x2="340" y2="180" stroke="#06b6d4" stroke-width="6" stroke-linecap="round"/>
  <!-- Vocabulary words under magnifier -->
  <line x1="270" y1="118" x2="308" y2="118" stroke="#bae6fd" stroke-width="2" opacity="0.8"/>
  <line x1="270" y1="128" x2="308" y2="128" stroke="#bae6fd" stroke-width="2" opacity="0.6"/>
  <line x1="270" y1="138" x2="300" y2="138" stroke="#bae6fd" stroke-width="2" opacity="0.6"/>
  <!-- Test paper -->
  <rect x="40" y="90" width="75" height="95" rx="4" fill="#1e3a5f" stroke="#0891b2" stroke-width="1.5"/>
  <line x1="50" y1="108" x2="105" y2="108" stroke="#e0f7ff" stroke-width="1.5" opacity="0.6"/>
  <text x="52" y="123" font-family="sans-serif" font-size="9" fill="#34d399">✓</text>
  <line x1="63" y1="123" x2="105" y2="123" stroke="#e0f7ff" stroke-width="1.2" opacity="0.5"/>
  <text x="52" y="137" font-family="sans-serif" font-size="9" fill="#34d399">✓</text>
  <line x1="63" y1="137" x2="100" y2="137" stroke="#e0f7ff" stroke-width="1.2" opacity="0.5"/>
  <text x="52" y="151" font-family="sans-serif" font-size="9" fill="#f87171">✗</text>
  <line x1="63" y1="151" x2="100" y2="151" stroke="#e0f7ff" stroke-width="1.2" opacity="0.5"/>
  <text x="52" y="165" font-family="sans-serif" font-size="9" fill="#34d399">✓</text>
  <line x1="63" y1="165" x2="105" y2="165" stroke="#e0f7ff" stroke-width="1.2" opacity="0.5"/>
  <!-- Label -->
  <rect x="10" y="10" width="230" height="30" rx="8" fill="#0891b2" opacity="0.75"/>
  <text x="125" y="30" font-family="sans-serif" font-size="12" font-weight="bold" fill="#e0f7ff" text-anchor="middle">Reading Future Connect 2</text>
</svg>
