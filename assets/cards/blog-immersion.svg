<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="40%" stop-color="#0c2340"/>
      <stop offset="100%" stop-color="#0a3050"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bg)"/>
  <!-- Underwater area -->
  <rect x="0" y="130" width="400" height="110" fill="#0369a1" opacity="0.4"/>
  <!-- Ocean waves -->
  <path d="M0,130 Q50,110 100,130 Q150,150 200,130 Q250,110 300,130 Q350,150 400,130 L400,240 L0,240 Z" fill="url(#waveGrad)" opacity="0.7"/>
  <path d="M0,145 Q60,125 120,145 Q180,165 240,145 Q300,125 360,145 Q380,155 400,145" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.5"/>
  <!-- Floating words above water -->
  <text x="55" y="95" font-family="sans-serif" font-size="14" fill="#bae6fd" opacity="0.8">listen</text>
  <text x="150" y="75" font-family="sans-serif" font-size="16" fill="#06b6d4" opacity="0.9" font-weight="bold">speak</text>
  <text x="250" y="90" font-family="sans-serif" font-size="13" fill="#bae6fd" opacity="0.7">read</text>
  <text x="320" y="72" font-family="sans-serif" font-size="15" fill="#0ea5e9" opacity="0.8">think</text>
  <!-- Floating words underwater (lighter) -->
  <text x="80" y="175" font-family="sans-serif" font-size="13" fill="#bae6fd" opacity="0.5">write</text>
  <text x="200" y="190" font-family="sans-serif" font-size="14" fill="#06b6d4" opacity="0.6">dream</text>
  <text x="300" y="172" font-family="sans-serif" font-size="12" fill="#bae6fd" opacity="0.45">feel</text>
  <!-- Headphones underwater -->
  <g transform="translate(200,175)">
    <path d="M-38,0 Q-38,-40 0,-40 Q38,-40 38,0" fill="none" stroke="#06b6d4" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <rect x="-46" y="-8" width="18" height="25" rx="7" fill="#0891b2" opacity="0.8"/>
    <rect x="28" y="-8" width="18" height="25" rx="7" fill="#0891b2" opacity="0.8"/>
  </g>
  <!-- Air bubbles from headphones -->
  <circle cx="175" cy="148" r="4" fill="none" stroke="#bae6fd" stroke-width="1.5" opacity="0.6"/>
  <circle cx="170" cy="135" r="3" fill="none" stroke="#bae6fd" stroke-width="1.5" opacity="0.5"/>
  <circle cx="227" cy="146" r="4" fill="none" stroke="#bae6fd" stroke-width="1.5" opacity="0.6"/>
  <circle cx="232" cy="133" r="3" fill="none" stroke="#bae6fd" stroke-width="1.5" opacity="0.5"/>
  <!-- Label -->
  <rect x="10" y="10" width="220" height="28" rx="8" fill="#0891b2" opacity="0.8"/>
  <text x="115" y="29" font-family="sans-serif" font-size="12" font-weight="bold" fill="#e0f7ff" text-anchor="middle">The Power of Immersion</text>
</svg>
