<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bg)"/>
  <!-- Academic page -->
  <rect x="70" y="35" width="140" height="185" rx="5" fill="#1e3a5f" stroke="#0891b2" stroke-width="1.5"/>
  <!-- Page header bar -->
  <rect x="70" y="35" width="140" height="22" rx="5" fill="#0891b2" opacity="0.7"/>
  <text x="140" y="50" font-family="sans-serif" font-size="9" fill="#e0f7ff" text-anchor="middle" font-weight="bold">READING PASSAGE</text>
  <!-- Paragraph lines -->
  <line x1="82" y1="72" x2="198" y2="72" stroke="#bae6fd" stroke-width="1.5" opacity="0.7"/>
  <line x1="82" y1="82" x2="198" y2="82" stroke="#bae6fd" stroke-width="1.5" opacity="0.6"/>
  <line x1="82" y1="92" x2="185" y2="92" stroke="#bae6fd" stroke-width="1.5" opacity="0.6"/>
  <line x1="82" y1="102" x2="198" y2="102" stroke="#bae6fd" stroke-width="1.5" opacity="0.6"/>
  <line x1="82" y1="112" x2="190" y2="112" stroke="#bae6fd" stroke-width="1.5" opacity="0.5"/>
  <line x1="82" y1="122" x2="198" y2="122" stroke="#bae6fd" stroke-width="1.5" opacity="0.5"/>
  <line x1="82" y1="132" x2="180" y2="132" stroke="#bae6fd" stroke-width="1.5" opacity="0.5"/>
  <line x1="82" y1="148" x2="198" y2="148" stroke="#bae6fd" stroke-width="1.5" opacity="0.5"/>
  <line x1="82" y1="158" x2="198" y2="158" stroke="#bae6fd" stroke-width="1.5" opacity="0.5"/>
  <line x1="82" y1="168" x2="190" y2="168" stroke="#bae6fd" stroke-width="1.5" opacity="0.4"/>
  <line x1="82" y1="178" x2="198" y2="178" stroke="#bae6fd" stroke-width="1.5" opacity="0.4"/>
  <!-- Magnifying glass -->
  <circle cx="270" cy="120" r="50" fill="none" stroke="#06b6d4" stroke-width="5"/>
  <circle cx="270" cy="120" r="44" fill="#0c2340" opacity="0.75"/>
  <line x1="307" y1="157" x2="340" y2="190" stroke="#06b6d4" stroke-width="7" stroke-linecap="round"/>
  <!-- Lines visible through magnifier -->
  <line x1="248" y1="105" x2="292" y2="105" stroke="#bae6fd" stroke-width="2" opacity="0.7"/>
  <line x1="248" y1="118" x2="292" y2="118" stroke="#bae6fd" stroke-width="2" opacity="0.6"/>
  <line x1="248" y1="131" x2="285" y2="131" stroke="#bae6fd" stroke-width="2" opacity="0.6"/>
  <!-- Timer chip -->
  <rect x="280" y="40" width="80" height="36" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
  <text x="320" y="54" font-family="sans-serif" font-size="9" fill="#fbbf24" text-anchor="middle">TIMER</text>
  <text x="320" y="68" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fbbf24" text-anchor="middle">20:00</text>
  <!-- Label -->
  <rect x="10" y="10" width="165" height="28" rx="8" fill="#0891b2" opacity="0.75"/>
  <text x="92" y="29" font-family="sans-serif" font-size="13" font-weight="bold" fill="#e0f7ff" text-anchor="middle">TOEFL Reading</text>
</svg>
