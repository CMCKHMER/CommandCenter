<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bg)"/>
  <!-- Stacked quiz sheets -->
  <rect x="125" y="90" width="160" height="125" rx="5" fill="#0c2340" stroke="#0891b2" stroke-width="1"/>
  <rect x="115" y="75" width="160" height="125" rx="5" fill="#0e2a4a" stroke="#0891b2" stroke-width="1"/>
  <rect x="105" y="60" width="160" height="125" rx="5" fill="#1e3a5f" stroke="#0ea5e9" stroke-width="1.5"/>
  <!-- Lines on top sheet -->
  <line x1="118" y1="82" x2="253" y2="82" stroke="#bae6fd" stroke-width="1.5" opacity="0.6"/>
  <line x1="118" y1="93" x2="253" y2="93" stroke="#bae6fd" stroke-width="1.5" opacity="0.5"/>
  <line x1="118" y1="104" x2="245" y2="104" stroke="#bae6fd" stroke-width="1.5" opacity="0.5"/>
  <line x1="118" y1="115" x2="253" y2="115" stroke="#bae6fd" stroke-width="1.5" opacity="0.5"/>
  <line x1="118" y1="126" x2="248" y2="126" stroke="#bae6fd" stroke-width="1.5" opacity="0.4"/>
  <!-- Small trophy/medal -->
  <path d="M290,55 Q290,95 315,95 Q340,95 340,55 Z" fill="url(#goldG)" opacity="0.9"/>
  <path d="M290,65 Q278,65 278,78 Q278,91 290,88" fill="none" stroke="#d97706" stroke-width="3"/>
  <path d="M340,65 Q352,65 352,78 Q352,91 340,88" fill="none" stroke="#d97706" stroke-width="3"/>
  <rect x="306" y="93" width="18" height="14" rx="2" fill="#d97706"/>
  <rect x="298" y="105" width="34" height="10" rx="3" fill="url(#goldG)"/>
  <polygon points="315,70 318,79 328,79 320,84 323,93 315,88 307,93 310,84 302,79 312,79" fill="#fff" opacity="0.9"/>
  <!-- "Unit" label on sheets -->
  <text x="157" y="76" font-family="sans-serif" font-size="9" fill="#fbbf24" opacity="0.8" font-weight="bold">UNIT 1</text>
  <!-- Label -->
  <rect x="10" y="10" width="120" height="28" rx="8" fill="#0891b2" opacity="0.75"/>
  <text x="70" y="29" font-family="sans-serif" font-size="13" font-weight="bold" fill="#e0f7ff" text-anchor="middle">Unit Test</text>
