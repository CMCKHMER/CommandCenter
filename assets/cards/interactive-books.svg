<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a1a2e"/>
    </linearGradient>
    <radialGradient id="bookGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bg)"/>
  <circle cx="200" cy="130" r="110" fill="url(#bookGlow)"/>
  <!-- Open glowing book -->
  <rect x="90" y="80" width="100" height="120" rx="5" fill="#0c2a40"/>
  <rect x="92" y="82" width="96" height="116" rx="4" fill="#0e3550"/>
  <rect x="210" y="80" width="100" height="120" rx="5" fill="#0f3060"/>
  <rect x="212" y="82" width="96" height="116" rx="4" fill="#1e3a5f"/>
  <!-- Spine glow -->
  <rect x="188" y="80" width="22" height="120" rx="3" fill="#0891b2" opacity="0.6"/>
  <!-- Glow from pages -->
  <rect x="188" y="80" width="22" height="120" rx="3" fill="url(#sparkGlow)"/>
  <!-- Lines on left page -->
  <line x1="100" y1="100" x2="182" y2="100" stroke="#bae6fd" stroke-width="1" opacity="0.5"/>
  <line x1="100" y1="112" x2="182" y2="112" stroke="#bae6fd" stroke-width="1" opacity="0.5"/>
  <line x1="100" y1="124" x2="175" y2="124" stroke="#bae6fd" stroke-width="1" opacity="0.5"/>
  <line x1="100" y1="136" x2="182" y2="136" stroke="#bae6fd" stroke-width="1" opacity="0.4"/>
  <!-- Lines on right page -->
  <line x1="218" y1="100" x2="302" y2="100" stroke="#bae6fd" stroke-width="1" opacity="0.5"/>
  <line x1="218" y1="112" x2="302" y2="112" stroke="#bae6fd" stroke-width="1" opacity="0.5"/>
  <line x1="218" y1="124" x2="295" y2="124" stroke="#bae6fd" stroke-width="1" opacity="0.4"/>
  <!-- Sparkles/pixels turning into glowing effects -->
  <circle cx="310" cy="75" r="4" fill="#fbbf24" opacity="0.9"/>
  <circle cx="330" cy="60" r="3" fill="#fbbf24" opacity="0.8"/>
  <circle cx="350" cy="75" r="5" fill="#fbbf24" opacity="0.75"/>
  <circle cx="340" cy="95" r="3" fill="#06b6d4" opacity="0.8"/>
  <circle cx="320" cy="50" r="2" fill="#a78bfa" opacity="0.8"/>
  <circle cx="360" cy="50" r="2" fill="#a78bfa" opacity="0.7"/>
  <!-- Star sparkle -->
  <line x1="330" y1="55" x2="330" y2="67" stroke="#fbbf24" stroke-width="1.5" opacity="0.7"/>
  <line x1="323" y1="61" x2="337" y2="61" stroke="#fbbf24" stroke-width="1.5" opacity="0.7"/>
  <line x1="325" y1="57" x2="335" y2="65" stroke="#fbbf24" stroke-width="1" opacity="0.5"/>
  <line x1="335" y1="57" x2="325" y2="65" stroke="#fbbf24" stroke-width="1" opacity="0.5"/>
  <!-- Finger tap ripple -->
  <circle cx="155" cy="165" r="8" fill="#06b6d4" opacity="0.5"/>
  <circle cx="155" cy="165" r="14" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.4"/>
  <circle cx="155" cy="165" r="20" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.25"/>
  <!-- Finger -->
  <ellipse cx="155" cy="162" rx="5" ry="8" fill="#fbbf24" opacity="0.8"/>
  <!-- Mystery glow from book center -->
  <ellipse cx="200" cy="140" rx="30" ry="15" fill="#06b6d4" opacity="0.12"/>
  <!-- Label -->
  <rect x="10" y="10" width="185" height="28" rx="8" fill="#0891b2" opacity="0.75"/>
  <text x="102" y="29" font-family="sans-serif" font-size="13" font-weight="bold" fill="#e0f7ff" text-anchor="middle">Interactive Books</text>
</svg>
