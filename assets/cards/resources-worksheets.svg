<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e2a1e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bg)"/>
  <!-- Clipboard body -->
  <rect x="120" y="45" width="160" height="175" rx="6" fill="#1e3a5f" stroke="#0891b2" stroke-width="2"/>
  <!-- Clipboard clip -->
  <rect x="168" y="38" width="64" height="22" rx="5" fill="#0891b2"/>
  <rect x="178" y="35" width="44" height="14" rx="4" fill="#06b6d4"/>
  <!-- Checklist items -->
  <rect x="133" y="75" width="14" height="14" rx="3" fill="none" stroke="#06b6d4" stroke-width="2"/>
  <text x="137" y="87" font-family="sans-serif" font-size="11" fill="#34d399" font-weight="bold">✓</text>
  <line x1="153" y1="82" x2="265" y2="82" stroke="#bae6fd" stroke-width="1.5" opacity="0.6"/>
  <rect x="133" y="97" width="14" height="14" rx="3" fill="none" stroke="#06b6d4" stroke-width="2"/>
  <text x="137" y="109" font-family="sans-serif" font-size="11" fill="#34d399" font-weight="bold">✓</text>
  <line x1="153" y1="104" x2="265" y2="104" stroke="#bae6fd" stroke-width="1.5" opacity="0.6"/>
  <rect x="133" y="119" width="14" height="14" rx="3" fill="none" stroke="#06b6d4" stroke-width="2"/>
  <text x="137" y="131" font-family="sans-serif" font-size="11" fill="#34d399" font-weight="bold">✓</text>
  <line x1="153" y1="126" x2="265" y2="126" stroke="#bae6fd" stroke-width="1.5" opacity="0.5"/>
  <rect x="133" y="141" width="14" height="14" rx="3" fill="none" stroke="#06b6d4" stroke-width="2"/>
  <line x1="153" y1="148" x2="255" y2="148" stroke="#bae6fd" stroke-width="1.5" opacity="0.5"/>
  <rect x="133" y="163" width="14" height="14" rx="3" fill="none" stroke="#06b6d4" stroke-width="2"/>
  <line x1="153" y1="170" x2="260" y2="170" stroke="#bae6fd" stroke-width="1.5" opacity="0.5"/>
  <!-- A+ grade badge -->
  <circle cx="315" cy="90" r="32" fill="#0f172a" stroke="#fbbf24" stroke-width="3"/>
  <text x="315" y="83" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fbbf24" text-anchor="middle">A+</text>
  <line x1="303" y1="93" x2="327" y2="93" stroke="#fbbf24" stroke-width="1.5" opacity="0.5"/>
  <text x="315" y="106" font-family="sans-serif" font-size="9" fill="#fbbf24" text-anchor="middle" opacity="0.7">GRADE</text>
  <!-- Pencil -->
  <g transform="translate(60,70) rotate(25)">
    <rect x="-5" y="0" width="10" height="80" rx="3" fill="#fbbf24"/>
    <polygon points="0,80 -5,95 5,95" fill="#e0e0e0"/>
    <rect x="-5" y="0" width="10" height="10" rx="3" fill="#d97706"/>
    <rect x="-5" y="65" width="10" height="15" rx="0" fill="#f9a8d4"/>
  </g>
  <!-- Label -->
  <rect x="10" y="10" width="130" height="28" rx="8" fill="#14b8a6" opacity="0.8"/>
  <text x="75" y="29" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">Worksheets</text>
</svg>
