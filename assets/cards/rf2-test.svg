<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bg)"/>
  <!-- Test paper background -->
  <rect x="100" y="25" width="200" height="190" rx="6" fill="#1e3a5f" stroke="#0891b2" stroke-width="2"/>
  <!-- Header bar -->
  <rect x="100" y="25" width="200" height="25" rx="6" fill="#0891b2" opacity="0.8"/>
  <text x="200" y="42" font-family="sans-serif" font-size="10" fill="#fff" text-anchor="middle" font-weight="bold">TEST PAPER</text>
  <!-- Q&A lines with checkmarks -->
  <text x="115" y="73" font-family="sans-serif" font-size="9" fill="#bae6fd" opacity="0.7">1.</text>
  <line x1="125" y1="72" x2="265" y2="72" stroke="#bae6fd" stroke-width="1.5" opacity="0.5"/>
  <line x1="115" y1="82" x2="265" y2="82" stroke="#bae6fd" stroke-width="1.5" opacity="0.4"/>
  <text x="270" y="77" font-family="sans-serif" font-size="13" fill="#34d399" opacity="0.9">✓</text>
  <text x="115" y="100" font-family="sans-serif" font-size="9" fill="#bae6fd" opacity="0.7">2.</text>
  <line x1="125" y1="99" x2="265" y2="99" stroke="#bae6fd" stroke-width="1.5" opacity="0.5"/>
  <line x1="115" y1="109" x2="265" y2="109" stroke="#bae6fd" stroke-width="1.5" opacity="0.4"/>
  <text x="270" y="104" font-family="sans-serif" font-size="13" fill="#34d399" opacity="0.9">✓</text>
  <text x="115" y="127" font-family="sans-serif" font-size="9" fill="#bae6fd" opacity="0.7">3.</text>
  <line x1="125" y1="126" x2="265" y2="126" stroke="#bae6fd" stroke-width="1.5" opacity="0.5"/>
  <line x1="115" y1="136" x2="265" y2="136" stroke="#bae6fd" stroke-width="1.5" opacity="0.4"/>
  <text x="270" y="131" font-family="sans-serif" font-size="13" fill="#f87171" opacity="0.8">✗</text>
  <text x="115" y="154" font-family="sans-serif" font-size="9" fill="#bae6fd" opacity="0.7">4.</text>
  <line x1="125" y1="153" x2="265" y2="153" stroke="#bae6fd" stroke-width="1.5" opacity="0.5"/>
  <line x1="115" y1="163" x2="265" y2="163" stroke="#bae6fd" stroke-width="1.5" opacity="0.4"/>
  <text x="270" y="158" font-family="sans-serif" font-size="13" fill="#34d399" opacity="0.9">✓</text>
  <!-- Pencil alongside -->
  <g transform="translate(75,45) rotate(10)">
    <rect x="-5" y="0" width="10" height="70" rx="3" fill="#fbbf24"/>
    <polygon points="0,70 -4,84 4,84" fill="#ddd"/>
    <rect x="-5" y="0" width="10" height="9" rx="3" fill="#d97706"/>
    <rect x="-4" y="58" width="8" height="12" rx="0" fill="#f9a8d4"/>
  </g>
  <!-- Score badge -->
  <circle cx="325" cy="70" r="32" fill="#0f172a" stroke="#fbbf24" stroke-width="2.5"/>
  <text x="325" y="63" font-family="sans-serif" font-size="11" fill="#fbbf24" text-anchor="middle">Score</text>
  <text x="325" y="82" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fbbf24" text-anchor="middle">90%</text>
  <!-- Label -->
  <rect x="10" y="10" width="90" height="28" rx="8" fill="#0891b2" opacity="0.75"/>
  <text x="55" y="29" font-family="sans-serif" font-size="13" font-weight="bold" fill="#e0f7ff" text-anchor="middle">Test</text>
</svg>
