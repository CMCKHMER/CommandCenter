<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="chartBar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bg)"/>
  <!-- Briefcase body -->
  <rect x="60" y="110" width="120" height="90" rx="6" fill="#1e3a5f" stroke="#0891b2" stroke-width="2"/>
  <!-- Briefcase handle -->
  <path d="M90,110 Q90,93 120,93 Q150,93 150,110" fill="none" stroke="#0891b2" stroke-width="3"/>
  <!-- Briefcase buckle -->
  <rect x="108" y="148" width="24" height="16" rx="3" fill="#fbbf24"/>
  <line x1="60" y1="148" x2="180" y2="148" stroke="#0369a1" stroke-width="2"/>
  <!-- Tie on briefcase -->
  <polygon points="120,118 113,138 120,135 127,138" fill="#f59e0b"/>
  <polygon points="120,118 113,118 117,110 120,114 123,110 127,118" fill="#fbbf24"/>
  <!-- Bar chart -->
  <rect x="220" y="170" width="22" height="45" rx="2" fill="url(#chartBar)" opacity="0.85"/>
  <rect x="248" y="148" width="22" height="67" rx="2" fill="url(#chartBar)" opacity="0.9"/>
  <rect x="276" y="120" width="22" height="95" rx="2" fill="url(#chartBar)" opacity="0.95"/>
  <rect x="304" y="135" width="22" height="80" rx="2" fill="url(#chartBar)" opacity="0.85"/>
  <rect x="332" y="105" width="22" height="110" rx="2" fill="url(#chartBar)"/>
  <!-- Chart baseline -->
  <line x1="215" y1="215" x2="360" y2="215" stroke="#0891b2" stroke-width="2" opacity="0.7"/>
  <!-- Upward trend line -->
  <path d="M231,165 L259,143 L287,115 L315,130 L343,100" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 3" opacity="0.8"/>
  <!-- Speech bubbles with business phrases -->
  <rect x="60" y="45" width="100" height="28" rx="10" fill="#0891b2" opacity="0.75"/>
  <polygon points="80,73 75,84 90,73" fill="#0891b2" opacity="0.75"/>
  <text x="110" y="63" font-family="sans-serif" font-size="9" fill="#fff" text-anchor="middle">Synergy</text>
  <rect x="200" y="45" width="110" height="28" rx="10" fill="#14b8a6" opacity="0.75"/>
  <polygon points="245,73 240,84 255,73" fill="#14b8a6" opacity="0.75"/>
  <text x="255" y="63" font-family="sans-serif" font-size="9" fill="#fff" text-anchor="middle">ROI • Leverage</text>
  <!-- Label -->
  <rect x="10" y="10" width="230" height="28" rx="8" fill="#f59e0b" opacity="0.85"/>
  <text x="120" y="29" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Business English Vocabulary</text>
</svg>
