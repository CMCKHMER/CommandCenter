<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bg)"/>
  <!-- Paper / sentence area -->
  <rect x="60" y="55" width="280" height="130" rx="6" fill="#1e3a5f" stroke="#0891b2" stroke-width="1.5"/>
  <!-- Wrong sentence (red strikethrough) -->
  <text x="85" y="95" font-family="sans-serif" font-size="13" fill="#f87171" opacity="0.85">He go to school everyday.</text>
  <line x1="82" y1="88" x2="318" y2="88" stroke="#f87171" stroke-width="2.5" opacity="0.85"/>
  <!-- Correction mark -->
  <text x="82" y="83" font-family="sans-serif" font-size="11" fill="#f87171" opacity="0.7">✗</text>
  <!-- Arrow pointing to correction -->
  <path d="M200,102 L200,115" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="102" x2="200" y2="112" stroke="#fbbf24" stroke-width="2"/>
  <polygon points="200,118 196,110 204,110" fill="#fbbf24" opacity="0.9"/>
  <!-- Corrected sentence (green) -->
  <text x="85" y="140" font-family="sans-serif" font-size="13" fill="#34d399" opacity="0.9">He goes to school every day.</text>
  <text x="82" y="135" font-family="sans-serif" font-size="11" fill="#34d399" opacity="0.9">✓</text>
  <!-- Warning triangle -->
  <polygon points="335,55 305,110 365,110" fill="#f59e0b" opacity="0.85"/>
  <polygon points="335,58 308,108 362,108" fill="#1e3a5f"/>
  <text x="335" y="98" font-family="sans-serif" font-size="22" font-weight="bold" fill="#f59e0b" text-anchor="middle">!</text>
  <!-- Red edit marks -->
  <circle cx="82" cy="168" r="4" fill="none" stroke="#f87171" stroke-width="2" opacity="0.7"/>
  <path d="M80,165 Q82,162 84,165" fill="none" stroke="#f87171" stroke-width="1.5" opacity="0.7"/>
  <text x="94" y="171" font-family="sans-serif" font-size="10" fill="#bae6fd" opacity="0.6">Common Grammar Errors</text>
  <!-- Label -->
  <rect x="10" y="10" width="240" height="28" rx="8" fill="#f59e0b" opacity="0.8"/>
  <text x="125" y="29" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Common English Mistakes</text>
</svg>
