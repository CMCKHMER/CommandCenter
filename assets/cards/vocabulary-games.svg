<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bg)"/>
  <!-- Letter tiles (Scrabble-like) spelling WORD -->
  <rect x="78" y="85" width="44" height="44" rx="5" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
  <text x="100" y="117" font-family="sans-serif" font-size="26" font-weight="bold" fill="#0f172a" text-anchor="middle">W</text>
  <text x="118" y="126" font-family="sans-serif" font-size="9" fill="#0f172a" text-anchor="middle" opacity="0.7">4</text>
  <rect x="128" y="85" width="44" height="44" rx="5" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
  <text x="150" y="117" font-family="sans-serif" font-size="26" font-weight="bold" fill="#0f172a" text-anchor="middle">O</text>
  <text x="168" y="126" font-family="sans-serif" font-size="9" fill="#0f172a" text-anchor="middle" opacity="0.7">1</text>
  <rect x="178" y="85" width="44" height="44" rx="5" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
  <text x="200" y="117" font-family="sans-serif" font-size="26" font-weight="bold" fill="#0f172a" text-anchor="middle">R</text>
  <text x="218" y="126" font-family="sans-serif" font-size="9" fill="#0f172a" text-anchor="middle" opacity="0.7">1</text>
  <rect x="228" y="85" width="44" height="44" rx="5" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
  <text x="250" y="117" font-family="sans-serif" font-size="26" font-weight="bold" fill="#0f172a" text-anchor="middle">D</text>
  <text x="268" y="126" font-family="sans-serif" font-size="9" fill="#0f172a" text-anchor="middle" opacity="0.7">2</text>
  <!-- Small extra tiles scattered -->
  <rect x="300" y="60" width="32" height="32" rx="4" fill="#f59e0b" opacity="0.6" stroke="#d97706" stroke-width="1.5"/>
  <text x="316" y="82" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">L</text>
  <rect x="45" y="60" width="30" height="30" rx="4" fill="#fbbf24" opacity="0.6" stroke="#d97706" stroke-width="1.5"/>
  <text x="60" y="80" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">E</text>
  <!-- Target/bullseye -->
  <circle cx="320" cy="155" r="40" fill="none" stroke="#f87171" stroke-width="3" opacity="0.8"/>
  <circle cx="320" cy="155" r="27" fill="none" stroke="#f87171" stroke-width="2.5" opacity="0.8"/>
  <circle cx="320" cy="155" r="14" fill="#f87171" opacity="0.5"/>
  <circle cx="320" cy="155" r="5" fill="#f87171" opacity="0.9"/>
  <!-- Dart -->
  <line x1="285" y1="120" x2="314" y2="152" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <polygon points="285,120 278,112 293,112" fill="#fbbf24" opacity="0.9"/>
  <!-- Dice with letter -->
  <rect x="50" y="155" width="50" height="50" rx="8" fill="#14b8a6" stroke="#0d9488" stroke-width="2"/>
  <text x="75" y="188" font-family="sans-serif" font-size="22" font-weight="bold" fill="#fff" text-anchor="middle">A</text>
  <circle cx="60" cy="165" r="3" fill="#fff" opacity="0.8"/>
  <circle cx="90" cy="195" r="3" fill="#fff" opacity="0.8"/>
  <!-- Small dice -->
  <rect x="110" y="170" width="38" height="38" rx="6" fill="#0891b2" stroke="#0369a1" stroke-width="2"/>
  <text x="129" y="196" font-family="sans-serif" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">Z</text>
  <!-- Label -->
  <rect x="10" y="10" width="185" height="28" rx="8" fill="#f59e0b" opacity="0.85"/>
  <text x="102" y="29" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Vocabulary Games</text>
</svg>
