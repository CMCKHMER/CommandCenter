<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0c2340"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bg)"/>
  <!-- Paper / notebook -->
  <rect x="90" y="50" width="160" height="170" rx="6" fill="url(#paper)" stroke="#0891b2" stroke-width="1.5"/>
  <!-- Ruled lines -->
  <line x1="105" y1="80" x2="235" y2="80" stroke="#bae6fd" stroke-width="1.5" opacity="0.6"/>
  <line x1="105" y1="97" x2="235" y2="97" stroke="#bae6fd" stroke-width="1.5" opacity="0.5"/>
  <line x1="105" y1="114" x2="235" y2="114" stroke="#bae6fd" stroke-width="1.5" opacity="0.5"/>
  <line x1="105" y1="131" x2="235" y2="131" stroke="#bae6fd" stroke-width="1.5" opacity="0.5"/>
  <line x1="105" y1="148" x2="235" y2="148" stroke="#bae6fd" stroke-width="1.5" opacity="0.5"/>
  <line x1="105" y1="165" x2="235" y2="165" stroke="#bae6fd" stroke-width="1.5" opacity="0.5"/>
  <!-- Edit marks -->
  <line x1="105" y1="97" x2="165" y2="97" stroke="#f87171" stroke-width="2" opacity="0.7"/>
  <line x1="105" y1="97" x2="165" y2="97" stroke="#f87171" stroke-width="2.5" opacity="0.5" stroke-dasharray="3 2"/>
  <text x="105" y="93" font-family="sans-serif" font-size="7" fill="#34d399" opacity="0.8">→ Use "however" here</text>
  <!-- Pen / hand writing -->
  <g transform="translate(290,80) rotate(35)">
    <rect x="-6" y="0" width="12" height="70" rx="4" fill="#fbbf24"/>
    <polygon points="0,70 -5,85 5,85" fill="#e0e0e0"/>
    <rect x="-6" y="0" width="12" height="10" rx="4" fill="#d97706"/>
    <rect x="-4" y="60" width="8" height="12" rx="1" fill="#e08000"/>
  </g>
  <!-- Ink pot -->
  <ellipse cx="340" cy="180" rx="22" ry="12" fill="#0891b2" opacity="0.7"/>
  <rect x="318" y="160" width="44" height="22" rx="5" fill="#0891b2" opacity="0.8"/>
  <ellipse cx="340" cy="160" rx="22" ry="10" fill="#06b6d4" opacity="0.9"/>
  <!-- Pencil cup -->
  <rect x="48" y="160" width="32" height="40" rx="5" fill="#1e3a5f" stroke="#0891b2" stroke-width="1.5"/>
  <rect x="54" y="130" width="6" height="35" rx="2" fill="#fbbf24"/>
  <polygon points="57,130 54,140 60,140" fill="#e08000"/>
  <rect x="64" y="135" width="6" height="30" rx="2" fill="#0ea5e9"/>
  <polygon points="67,135 64,145 70,145" fill="#bae6fd"/>
  <rect x="74" y="140" width="6" height="25" rx="2" fill="#34d399"/>
  <polygon points="77,140 74,150 80,150" fill="#6ee7b7"/>
  <!-- Label -->
  <rect x="10" y="10" width="185" height="30" rx="8" fill="#0891b2" opacity="0.75"/>
  <text x="102" y="30" font-family="sans-serif" font-size="13" font-weight="bold" fill="#e0f7ff" text-anchor="middle">Writing Workshop</text>
</svg>
