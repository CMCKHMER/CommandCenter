<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="clipGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#90e0ef;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="paperGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f2fe;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGradient)" rx="12"/>
  
  <!-- Clipboard base -->
  <rect x="80" y="60" width="240" height="200" fill="#1a1f2e" rx="8" filter="url(#shadow)"/>
  
  <!-- Paper/Assessment sheet -->
  <rect x="95" y="75" width="210" height="170" fill="url(#paperGradient)" rx="4" filter="url(#shadow)"/>
  
  <!-- Clipboard clip at top -->
  <rect x="170" y="50" width="60" height="25" fill="#475569" rx="4"/>
  <circle cx="200" cy="62" r="6" fill="#64748b"/>
  
  <!-- Assessment title lines -->
  <rect x="110" y="90" width="180" height="8" fill="#0ea5e9" rx="2"/>
  <rect x="110" y="105" width="140" height="6" fill="#94a3b8" rx="2"/>
  
  <!-- Grade/Score circle with checkmark -->
  <circle cx="260" cy="130" r="28" fill="url(#clipGradient)" filter="url(#shadow)"/>
  <path d="M 248 130 L 256 138 L 272 120" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Score text A+ -->
  <text x="260" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">A+</text>
  
  <!-- Assessment rows/checklist -->
  <g transform="translate(110, 150)">
    <rect x="0" y="0" width="12" height="12" fill="#10b981" rx="2"/>
    <path d="M 3 6 L 5 8 L 9 3" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="20" y="2" width="80" height="8" fill="#64748b" rx="2"/>
    
    <rect x="0" y="20" width="12" height="12" fill="#10b981" rx="2"/>
    <path d="M 3 26 L 5 28 L 9 23" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="20" y="22" width="90" height="8" fill="#64748b" rx="2"/>
    
    <rect x="0" y="40" width="12" height="12" fill="#f59e0b" rx="2"/>
    <rect x="20" y="42" width="70" height="8" fill="#64748b" rx="2"/>
  </g>
  
  <!-- Student icon silhouette -->
  <circle cx="150" cy="220" r="18" fill="url(#clipGradient)"/>
  <path d="M 150 242 C 135 242 128 255 128 260 L 172 260 C 172 255 165 242 150 242" fill="url(#clipGradient)"/>
  
  <!-- Decorative elements -->
  <circle cx="340" cy="40" r="15" fill="rgba(144, 224, 239, 0.2)"/>
  <circle cx="50" cy="260" r="20" fill="rgba(251, 191, 36, 0.15)"/>
  <rect x="320" y="250" width="30" height="30" fill="rgba(14, 165, 233, 0.1)" transform="rotate(15 335 265)"/>
</svg>
