<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bg)"/>
  <!-- Backpack body -->
  <rect x="130" y="70" width="100" height="120" rx="15" fill="#1e3a5f" stroke="#0891b2" stroke-width="2"/>
  <!-- Backpack flap -->
  <path d="M130,70 Q180,45 230,70 L225,105 Q180,85 135,105 Z" fill="#0891b2" opacity="0.8"/>
  <!-- Buckle/strap detail -->
  <rect x="168" y="88" width="24" height="12" rx="3" fill="#fbbf24" opacity="0.9"/>
  <!-- Pocket -->
  <rect x="145" y="148" width="70" height="35" rx="8" fill="#0c2340" stroke="#0891b2" stroke-width="1.5"/>
  <!-- Zipper line -->
  <line x1="155" y1="155" x2="205" y2="155" stroke="#06b6d4" stroke-width="2" opacity="0.7" stroke-dasharray="4 3"/>
  <!-- Straps -->
  <path d="M148,75 Q130,110 135,180" fill="none" stroke="#0369a1" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <path d="M212,75 Q230,110 225,180" fill="none" stroke="#0369a1" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <!-- Worksheets sticking out -->
  <rect x="252" y="80" width="65" height="85" rx="3" fill="#1e3a5f" stroke="#06b6d4" stroke-width="1.5" transform="rotate(12 252 80)"/>
  <line x1="258" y1="98" x2="310" y2="88" stroke="#bae6fd" stroke-width="1.2" opacity="0.5"/>
  <line x1="258" y1="108" x2="310" y2="98" stroke="#bae6fd" stroke-width="1.2" opacity="0.5"/>
  <line x1="258" y1="118" x2="305" y2="108" stroke="#bae6fd" stroke-width="1.2" opacity="0.5"/>
  <!-- Ruler -->
  <rect x="45" y="100" width="15" height="100" rx="2" fill="#fbbf24" opacity="0.85"/>
  <line x1="48" y1="112" x2="57" y2="112" stroke="#0f172a" stroke-width="1.2"/>
  <line x1="48" y1="122" x2="57" y2="122" stroke="#0f172a" stroke-width="1.2"/>
  <line x1="48" y1="132" x2="53" y2="132" stroke="#0f172a" stroke-width="1"/>
  <line x1="48" y1="142" x2="57" y2="142" stroke="#0f172a" stroke-width="1.2"/>
  <line x1="48" y1="152" x2="53" y2="152" stroke="#0f172a" stroke-width="1"/>
  <line x1="48" y1="162" x2="57" y2="162" stroke="#0f172a" stroke-width="1.2"/>
  <line x1="48" y1="172" x2="53" y2="172" stroke="#0f172a" stroke-width="1"/>
  <line x1="48" y1="182" x2="57" y2="182" stroke="#0f172a" stroke-width="1.2"/>
  <!-- Highlighter -->
  <rect x="70" y="145" width="12" height="50" rx="4" fill="#34d399" opacity="0.85"/>
  <rect x="72" y="190" width="8" height="8" rx="1" fill="#0d9488"/>
  <rect x="70" y="141" width="12" height="8" rx="2" fill="#6ee7b7"/>
  <!-- Sticky notes -->
  <rect x="310" y="148" width="48" height="44" rx="3" fill="#fbbf24" opacity="0.85"/>
  <line x1="316" y1="160" x2="352" y2="160" stroke="#d97706" stroke-width="1.5" opacity="0.7"/>
  <line x1="316" y1="170" x2="352" y2="170" stroke="#d97706" stroke-width="1.5" opacity="0.7"/>
  <line x1="316" y1="180" x2="345" y2="180" stroke="#d97706" stroke-width="1.5" opacity="0.7"/>
  <rect x="325" y="135" width="42" height="40" rx="3" fill="#f472b6" opacity="0.7"/>
  <line x1="330" y1="147" x2="361" y2="147" stroke="#be185d" stroke-width="1.5" opacity="0.7"/>
  <line x1="330" y1="157" x2="361" y2="157" stroke="#be185d" stroke-width="1.5" opacity="0.7"/>
  <!-- Label -->
  <rect x="10" y="10" width="175" height="28" rx="8" fill="#0891b2" opacity="0.75"/>
  <text x="97" y="29" font-family="sans-serif" font-size="13" font-weight="bold" fill="#e0f7ff" text-anchor="middle">Study Materials</text>
</svg>
