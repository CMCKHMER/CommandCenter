        let currentUnit = 1;
        const unitSelect = document.getElementById('unit-select');
        const unitTitle = document.getElementById('unit-title');
        const vocabTbody = document.getElementById('vocab-tbody');
        const pageIndicator = document.getElementById('page-indicator');
        const quizToggleBtn = document.getElementById('quiz-toggle');
        const themeToggleBtn = document.getElementById('theme-toggle');

        function init() {
            Object.keys(vocabularyData).forEach(unitNum => {
                const option = document.createElement('option');
                option.value = unitNum;
                option.textContent = vocabularyData[unitNum].title;
                unitSelect.appendChild(option);
            });

            const urlParams = new URLSearchParams(window.location.search);
            const unitParam = urlParams.get('unit');
            const startUnit = unitParam && vocabularyData[unitParam] ? parseInt(unitParam) : 1;

            loadUnit(startUnit);
            unitSelect.value = startUnit;

            unitSelect.addEventListener('change', (e) => {
                const newUnit = parseInt(e.target.value);
                loadUnit(newUnit);
                updateURL(newUnit);
            });
        }

        function updateURL(unit) {
            const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + "?unit=" + unit;
            window.history.pushState({ path: newUrl }, '', newUrl);
        }

        function loadUnit(unitNum) {
            currentUnit = unitNum;
            const unitData = vocabularyData[unitNum];
            unitTitle.textContent = unitData.title;
            pageIndicator.textContent = `Unit ${unitNum} of ${Object.keys(vocabularyData).length}`;
            
            vocabTbody.innerHTML = '';
            unitData.words.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="word-cell">${item.word}</td>
                    <td class="pos-cell">${item.pos}</td>
                    <td class="def-cell">${item.def}</td>
                    <td class="sent-cell"><em>"${item.sent}"</em></td>
                `;
                vocabTbody.appendChild(row);
            });
        }

        function toggleQuizMode() {
            const table = document.getElementById('vocab-table');
            if (table.classList.contains('quiz-mode')) {
                table.classList.remove('quiz-mode');
                quizToggleBtn.textContent = '👁️ Quiz Mode (Hide Answers)';
            } else {
                table.classList.add('quiz-mode');
                quizToggleBtn.textContent = '👁️‍🗨️ Show Answers';
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            themeToggleBtn.textContent = isDark ? "☀️ Light Mode" : "🌙 Dark Mode";
        }

        init();
    </script>
