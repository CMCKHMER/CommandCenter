function doStartHeist(tid){var t=null;for(var i=0;i<TGTS.length;i++){if(TGTS[i].id===tid){t=TGTS[i];break}}if(!t)return;H.target=t;H.layers=genL(t);H.li=0;H.alerts=0;H.typed='';H.phase='input';renderHeist();setTimeout(function(){var inp=document.getElementById('hIn');if(inp)inp.focus()},80)}

function submitH(){if(H.phase!=='input'||!H.layers.length)return;var l=H.layers[H.li];if(nS(H.typed)===nS(l.a)){H.phase='ok';snd('grant');spB(eC().x,eC().y,'#10b981',25);renderHeist();setTimeout(function(){H.li++;if(H.li>=H.layers){H.money+=H.target.reward;if(H.emblems.indexOf(H.target.id)===-1)H.emblems.push(H.target.id);svH();closeSheet();openSheet('hres')}else{H.typed='';H.phase='input';renderHeist()}},1400)}else{H.alerts++;snd('wrong');trigG();H.phase='no';renderHeist();if(H.alerts>=H.maxA){setTimeout(function(){snd('over');closeSheet();openSheet('hres')},1800)}else{setTimeout(function(){H.typed='';H.phase='input';renderHeist()},1800)}}}

/* === RENDER PER SHEET === */
function renderSheet(id){var el=sheets[id];if(!el)return;if(id==='judge'||id==='fix'||id==='spot'||id==='survival')renderGame(el,id);else if(id==='heist')renderHeist();}

function renderGame(el,mode){
var s=GM.cur;if(!s)return;
var hearts='';if(mode!=='survival')for(var i=0;i<3;i++)hearts+='<span class="ht '+(i>=GM.lives?'lo':'')+'" style="color:var(--er);font-size:18px"><i class="fa-solid fa-heart"></i></span>';
var mn={judge:'Syntax Judge',fix:'Error Fix',spot:'Spot the Error',survival:'Survival'};
var h='<div class="min-h-screen flex flex-col items-center justify-center px-4 py-4">';
h+='<div class="w-full max-w-2xl flex items-center justify-between mb-4"><div class="flex items-center gap-3"><div><div class="sl">Score</div><div class="sv" id="sD" style="color:var(--ac)">'+GM.score+'</div></div><div><div class="sl">Streak</div><div class="sv '+(GM.streak>=5?'sf':'')+'" style="color:'+(GM.streak>=5?'var(--wn)':'var(--tx)')+'">'+GM.streak+'<span class="text-sm font-normal" style="color:var(--mt)">x</span></div></div></div><div class="flex items-center gap-3"><div class="text-right"><div class="sl">Round</div><div class="sv">'+GM.round+'</div></div><div class="text-right"><div class="sl">Level</div><div class="db d'+GM.lv+'">'+DL[GM.lv]+'</div></div>'+(mode==='survival'?'<div style="color:var(--mt);font-size:12px"><i class="fa-solid fa-skull" style="color:#c084fc"></i> No lives</div>':'<div class="flex gap-1">'+hearts+'</div>')+'</div></div>';
h+='<div class="ec w-full max-w-2xl si" id="edC"><div class="etb"><span class="dt r"></span><span class="dt y"></span><span class="dt g"></span><span class="etab">sentence_'+GM.round+'.syn</span><div style="flex:1"></div><span class="ml">'+mn[mode]+'</span></div><div class="ttk"><div class="tfl" id="tFl" style="width:100%"></div></div><div class="eby"><div class="ln">1</div><div class="sa" id="sA">'+esc(s.t)+'</div></div><div class="co" id="cO"></div></div>';
h+='<div id="jB" style="width:100%;max-width:42rem">';
if(mode==='judge'||mode==='survival')h+='<div class="flex gap-4 mt-4"><button class="bj bi bs" onclick="hJ(false)"><i class="fa-solid fa-xmark"></i> Incorrect <kbd class="ml-2 px-2 py-0.5 rounded text-xs font-mono" style="background:var(--sf);border:1px solid var(--bd);color:var(--mt)">A</kbd></button><button class="bj bc bs" onclick="hJ(true)"><i class="fa-solid fa-check"></i> Correct <kbd class="ml-2 px-2 py-0.5 rounded text-xs font-mono" style="background:var(--sf);border:1px solid var(--bd);color:var(--mt)">D</kbd></button></div>';
else if(mode==='fix'&&GM.opts.length){h+='<div class="flex flex-wrap gap-3 mt-4 justify-center">';for(var fi=0;fi<GM.opts.length;fi++)h+='<button class="ck" data-v="'+esc(GM.opts[fi].text)+'" onclick="hFi('+fi+')">'+esc(GM.opts[fi].text)+'</button>';h+='<span class="text-xs self-center" style="color:var(--mt)">1-4</span></div>'}
else if(mode==='spot'&&s.w){h+='<div class="flex flex-wrap gap-2 mt-4 justify-center">';for(var si2=0;si2<s.w.length;si2++)h+='<button class="ck" data-i="'+si2+'" onclick="hSp('+si2+')">'+esc(s.w[si2])+'</button>';h+='</div>'}
h+='</div></div>';el.innerHTML=h}

function renderHeist(){
var el=sheets.heist;if(!H.target||!H.layers.length){el.innerHTML='<div class="min-h-screen flex items-center justify-center"><p style="color:var(--mt)">No target selected.</p></div>';return}
var t=H.target,l=H.layers[H.li],pct=(H.li/t.layers)*100,alerts='';for(var i=0;i<H.maxA;i++)alerts+='<span class="ldot '+(i<H.maxA-H.alerts?'on':'off')+'"></span>';
var sent=l.d.replace('___','<span class="bk">'+esc(H.typed)+'</span>');
var agText='';if(H.phase==='ok')agText='<div class="ag-t gr">ACCESS GRANTED</div>';if(H.phase==='no')agText='<div class="ag-t dn">ACCESS DENIED</div>';
var h='<div class="min-h-screen flex flex-col items-center justify-center px-4 py-4">';
h+='<div class="w-full max-w-2xl flex items-center justify-between mb-4"><div><div class="sl">Target</div><div class="font-bold" style="color:'+t.col+'"><i class="fa-solid '+t.icon+' mr-1"></i>'+t.name+'</div></div><div class="flex items-center gap-3"><div class="text-right"><div class="sl">Layer</div><div class="font-mono font-bold">'+(H.li+1)+'/'+t.layers+'</div></div><div class="text-right"><div class="sl">Alerts</div><div>'+alerts+'</div></div></div></div>';
h+='<div class="trm w-full max-w-2xl si"><div class="trm-hd"><div class="flex items-center gap-2"><span class="dt r"></span><span class="dt y"></span><span class="dt g"></span><span class="font-mono text-xs" style="color:var(--mt);margin-left:8px">breach_protocol</span></div><span class="ml">LAYER '+(H.li+1)+'</span></div>';
h+='<div class="trm-bd"><div class="trm-sent">'+sent+'</div>'+agText;
if(H.phase==='input')h+='<div class="trm-pr"><span style="color:var(--cy);margin-right:8px">$</span><input type="text" id="hIn" value="'+esc(H.typed)+'" oninput="H.typed=this.value;snd(\'key\')" onkeydown="if(event.key===\'Enter\'){event.preventDefault();submitH()}" autocomplete="off" spellcheck="false" placeholder="type the correct word..."></div>';
h+='</div><div class="trm-ft"><div class="flex items-center gap-3"><span class="text-xs" style="color:var(--mt)">Progress</span><div class="al-trk"><div class="al-fl" style="width:'+pct+'%;background:'+t.col+'"></div></div><span class="font-mono text-xs" style="color:var(--mt)">'+Math.round(pct)+'%</span></div><div class="font-mono text-xs" style="color:var(--wn)">$'+t.reward.toLocaleString()+'</div></div></div>';
h+='<div class="text-center mt-3 text-xs" style="color:var(--mt)">Type the correct word and press Enter</div></div>';el.innerHTML=h;
if(H.phase==='input')setTimeout(function(){var inp=document.getElementById('hIn');if(inp)inp.focus()},50);
}

function renderHRes(){
var el=sheets['hres'];if(!H.target){el.innerHTML='';return}
var t=H.target,won=H.li>=t.layers,rk=getRank();
var embs='';for(var i=0;i<TGTS.length;i++){var tg=TGTS[i],has=H.emblems.indexOf(tg.id)!==-1;embs+='<div class="emb '+(has?'on':'off')+'" title="'+tg.embN+'"><i class="fa-solid '+tg.emb+'"></i></div>'}
var h='<div class="min-h-screen flex flex-col items-center justify-center px-4 py-8">';
if(won)h+='<div class="text-center mb-6"><div class="font-mono text-sm tracking-[4px] uppercase mb-2" style="color:var(--ac)">System Breached</div><div class="font-mono font-bold text-6xl mb-2" style="color:var(--ac)">$'+t.reward.toLocaleString()+'</div><div class="text-sm" style="color:var(--mt)">Transferred to account</div></div>';
else h+='<div class="text-center mb-6"><div class="font-mono text-sm tracking-[4px] uppercase mb-2" style="color:var(--er)">Connection Terminated</div><div class="font-mono font-bold text-5xl mb-2" style="color:var(--er)">DISCONNECTED</div></div>';
h+='<div class="grid grid-cols-2 gap-4 w-full max-w-sm mb-6"><div class="text-center p-4 rounded-lg" style="background:var(--cd);border:1px solid var(--bd)"><div class="sl mb-1">Rank</div><div class="sv" style="color:var(--ac)">'+rk[0]+'</div></div><div class="text-center p-4 rounded-lg" style="background:var(--cd);border:1px solid var(--bd)"><div class="sl mb-1">Balance</div><div class="sv" style="color:var(--wn)">$'+H.money.toLocaleString()+'</div></div></div>';
h+='<div class="text-center mb-6"><div class="sl mb-2">Emblems</div><div class="flex gap-3 justify-center">'+embs+'</div></div>';
h+='<div class="flex gap-4 justify-center"><button class="bp" onclick="closeSheet();openSheet(\'heist\',\''+t.id+'\')"><i class="fa-solid fa-rotate-right mr-2"></i> Retry</button><button style="background:transparent;border:2px solid var(--bd);color:var(--tx);font-weight:700;padding:14px 28px;border-radius:10px;cursor:pointer;font-family:\'Space Grotesk\',sans-serif;font-size:16px;transition:all .2s" onmouseover="this.style.borderColor=\'var(--cy)\';this.style.color=\'var(--cy)\'" onmouseout="this.style.borderColor=\'var(--bd)\';this.style.color=\'var(--tx)\'" onclick="closeSheet()">Menu</button></div></div>';el.innerHTML=h;
}

function renderOver(el){
var total=GM.tc+GM.tw,acc=total>0?Math.round(GM.tc/total*100):0,grade,gc;
var mn={judge:'Syntax Judge',fix:'Error Fix',spot:'Spot the Error',survival:'Survival'};
if(GM.mode==='survival'){grade=GM.round;gc='#c084fc'}else{if(acc>=90){grade='S';gc='var(--ac)'}else if(acc>=75){grade='A';gc='var(--cy)'}else if(acc>=60){grade='B';gc='var(--wn)'}else if(acc>=40){grade='C';gc='var(--tx)'}else{grade='F';gc='var(--er)'}}
var h='<div class="min-h-screen flex flex-col items-center justify-center px-4">';
h+='<div class="text-center mb-6"><div class="font-mono text-sm tracking-[4px] uppercase mb-2" style="color:var(--mt)">'+mn[GM.mode]+' — '+(GM.mode==='survival'?'Terminated':'Failed')+'</div><div class="font-mono font-bold text-8xl mb-2" style="color:'+gc+'">'+grade+'</div><div class="text-sm" style="color:var(--mt)">Final '+(GM.mode==='survival'?'Rounds':'Grade')+'</div></div>';
h+='<div class="grid grid-cols-2 gap-4 w-full max-w-sm mb-8"><div class="text-center p-4 rounded-lg" style="background:var(--cd);border:1px solid var(--bd)"><div class="sl mb-1">Score</div><div class="sv" style="color:var(--ac)">'+GM.score+'</div></div><div class="text-center p-4 rounded-lg" style="background:var(--cd);border:1px solid var(--bd)"><div class="sl mb-1">Rounds</div><div class="sv">'+GM.round+'</div></div><div class="text-center p-4 rounded-lg" style="background:var(--cd);border:1px solid var(--bd)"><div class="sl mb-1">Accuracy</div><div class="sv">'+acc+'%</div></div><div class="text-center p-4 rounded-lg" style="background:var(--cd);border:1px solid var(--bd)"><div class="sl mb-1">Best Streak</div><div class="sv" style="color:'+(GM.best>=5?'var(--wn)':'var(--tx)')+'">'+GM.best+'x</div></div></div>';
h+='<div class="flex gap-4"><button class="bp" onclick="closeSheet();openSheet(\''+GM.mode+'\')"><i class="fa-solid fa-rotate-right mr-2"></i> Replay</button><button style="background:transparent;border:2px solid var(--bd);color:var(--tx);font-weight:700;padding:14px 28px;border-radius:10px;cursor:pointer;font-family:\'Space Grotesk\',sans-serif;font-size:16px;transition:all .2s" onmouseover="this.style.borderColor=\'var(--cy)\';this.style.color=\'var(--cy)\'" onmouseout="this.style.borderColor=\'var(--bd)\';this.style.color=\'var(--tx)\'" onclick="closeSheet()">Menu</button></div></div>';el.innerHTML=h;
}

/* === MENU === */
function renderMenu(){
var app=document.getElementById('app');
var th='',title='SYNTAX CLASH';for(var i=0;i<title.length;i++)th+='<span class="tc" style="animation-delay:'+(i*.06)+'s">'+(title[i]===' '?'&nbsp;&nbsp;':esc(title[i]))+'</span>';
var modes=[
{id:'judge',name:'Syntax Judge',desc:'Decide if each sentence is correct or has an error.',icon:'fa-gavel',color:'var(--ac)',tag:'Classic',tb:'rgba(16,185,129,.15)',tc2:'var(--ac)',pr:'She don\'t like pizza.\n<span class="hl">don\'t</span> → <span class="fx">doesn\'t</span>'},
{id:'fix',name:'Error Fix',desc:'Pick the correct replacement for the wrong word.',icon:'fa-wrench',color:'var(--wn)',tag:'Precision',tb:'rgba(210,153,34,.15)',tc2:'var(--wn)',pr:'Their going to the beach.\n<span class="hl">Their</span> → <span class="fx">They\'re</span>'},
{id:'spot',name:'Spot the Error',desc:'Click the exact word that is incorrect.',icon:'fa-crosshairs',color:'var(--er)',tag:'Focus',tb:'rgba(248,81,73,.15)',tc2:'var(--er)',pr:'Between you and I, this is bad.\nError: <span class="hl">I</span>'},
{id:'survival',name:'Survival',desc:'No lives — one mistake ends it.',icon:'fa-skull',color:'#c084fc',tag:'Endless',tb:'rgba(192,132,252,.15)',tc2:'#c084fc',pr:'One wrong answer\nand it\'s over.'},
{id:'heist',name:'Terminal Heist',desc:'Type correct words to breach security, steal money, collect emblems.',icon:'fa-terminal',color:'var(--cy)',tag:'Heist',tb:'rgba(57,210,192,.15)',tc2:'var(--cy)',pr:'Type: <span class="fx">doesn\'t</span>\nto bypass the firewall\nand access the vault'}
];
var cards='';for(var m=0;m<modes.length;m++){var d=modes[m];cards+='<div class="ms" onclick="openSheet(\''+d.id+'\')" tabindex="0" role="button"><div style="position:absolute;top:0;left:0;right:0;height:3px;background:'+d.color+';opacity:0;transition:opacity .3s"></div><div class="ms-ic" style="background:'+d.tb+';color:'+d.color+'"><i class="fa-solid '+d.icon+'"></i></div><div class="flex items-center gap-2 mb-1"><span class="font-bold text-lg" style="color:#e6edf3">'+d.name+'</span><span class="ms-tg" style="background:'+d.tb+';color:'+d.tc2+'">'+d.tag+'</span></div><p class="text-sm mb-2" style="color:var(--mt)">'+d.desc+'</p><div class="ms-pr">'+d.pr+'</div></div>'}
var rk=getRank();var embs='';for(var e=0;e<TGTS.length;e++){var t=TGTS[e],has=H.emblems.indexOf(t.id)!==-1;embs+='<div class="emb '+(has?'on':'off')+'" title="'+t.embN+'"><i class="fa-solid '+t.emb+'"></i></div>'}
var h='<div class="min-h-screen flex flex-col items-center px-4 py-10">';
h+='<div class="text-center mb-8"><div class="font-mono text-sm tracking-[6px] uppercase mb-3" style="color:var(--mt)">Grammar Validation Game</div><h1 class="font-mono font-bold text-5xl md:text-7xl tracking-tight mb-3" style="color:#e6edf3">'+th+'</h1></div>';
h+='<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 w-full max-w-4xl mb-8">'+cards+'</div>';
h+='<div class="w-full max-w-4xl" style="border-top:1px solid var(--bd);padding-top:20px"><div class="flex items-center justify-between flex-wrap gap-4"><div><div class="flex items-center gap-3 mb-2"><span class="font-bold text-lg" style="color:#e6edf3"><i class="fa-solid fa-terminal mr-2" style="color:var(--cy)"></i>Heist Stats</span></div><div class="text-sm" style="color:var(--mt)">Type correct words to breach systems</div></div><div class="text-right"><div class="sl">Rank</div><div class="font-mono font-bold text-lg" style="color:var(--ac)">'+rk[0]+'</div><div class="sl mt-1">Balance</div><div class="font-mono font-bold text-lg" style="color:var(--wn)">$'+H.money.toLocaleString()+'</div></div></div>';
h+='<div class="flex items-center gap-6 mt-4 flex-wrap"><div class="flex gap-2">'+embs+'</div><div class="flex gap-3">';
for(var hi=0;hi<TGTS.length;hi++){var tg=TGTS[hi];h+='<div class="hc '+(H.emblems.indexOf(tg.id)!==-1?'done':'')+'" onclick="openSheet(\'heist\',\''+tg.id+'\')" style="flex:1;min-width:140px"><div class="flex items-center gap-2 mb-1"><i class="fa-solid '+tg.icon+'" style="color:'+tg.col+'"></i><span class="font-bold text-sm" style="color:#e6edf3">'+tg.name+'</span></div><div class="text-xs" style="color:var(--mt)">'+tg.layers+' layers</div><div class="font-mono text-xs font-bold mt-1" style="color:var(--wn)">$'+tg.reward.toLocaleString()+'</div></div>'}
h+='</div></div></div></div>';app.innerHTML=h;
setTimeout(function(){document.querySelectorAll('.ms').forEach(function(c){c.addEventListener('mouseenter',function(){var bar=c.querySelector('div[style*="height:3px"]');if(bar)bar.style.opacity='1'});c.addEventListener('mouseleave',function(){var bar=c.querySelector('div[style*="height:3px"]');if(bar)bar.style.opacity='0'})})},100);
}

document.getElementById('backBtn').addEventListener('click',closeSheet);
document.addEventListener('keydown',function(e){
if(activeSheet&&(activeSheet==='judge'||activeSheet==='fix'||activeSheet==='spot'||activeSheet==='survival')&&!GM.ans){
if(activeSheet==='judge'||activeSheet==='survival'){if(e.key==='a'||e.key==='A'||e.key==='ArrowLeft'){e.preventDefault();hJ(false)}else if(e.key==='d'||e.key==='D'||e.key==='ArrowRight'){e.preventDefault();hJ(true)}}
else if(activeSheet==='fix'){var n=parseInt(e.key);if(n>=1&&n<=GM.opts.length){e.preventDefault();hFi(n-1)}}
else if(activeSheet==='spot'){var n2=parseInt(e.key);if(n2>=1&&n2<=GM.cur.w.length){e.preventDefault();hSp(n2-1)}}
}
if(activeSheet==='over'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();closeSheet();openSheet(GM.mode)}
});

createSheet('hres');
renderMenu();
</script>
</body>
