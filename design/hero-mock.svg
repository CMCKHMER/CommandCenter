    <radialGradient id="poolB"><stop offset="0" stop-color="#a855f7" stop-opacity=".15"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
    <radialGradient id="poolC"><stop offset="0" stop-color="#a3e635" stop-opacity=".09"/><stop offset="1" stop-color="#a3e635" stop-opacity="0"/></radialGradient>
    <pattern id="gFine" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" stroke="#22d3ee" stroke-opacity=".045"/></pattern>
    <pattern id="gCoarse" width="130" height="130" patternUnits="userSpaceOnUse"><path d="M130 0H0V130" stroke="#22d3ee" stroke-opacity=".075"/></pattern>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101826" stop-opacity=".88"/><stop offset="1" stop-color="#080d16" stop-opacity=".92"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e1624" stop-opacity=".9"/><stop offset="1" stop-color="#080d16" stop-opacity=".8"/></linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset=".45" stop-color="#22d3ee"/><stop offset="1" stop-color="#a3e635"/></linearGradient>
    <linearGradient id="ctl" x1="0" y1="0" x2="1" y2="0"><stop offset=".04" stop-color="#22d3ee"/><stop offset=".38" stop-color="#7dd3fc"/><stop offset=".88" stop-color="#a855f7"/></linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7dd3fc"/><stop offset=".42" stop-color="#22d3ee"/><stop offset="1" stop-color="#a3e635"/></linearGradient>
    <linearGradient id="sparkStroke" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".62" stop-color="#67e8f9"/><stop offset="1" stop-color="#a3e635"/></linearGradient>
    <linearGradient id="sparkFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".3"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
    <linearGradient id="barG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#0e7490" stop-opacity=".45"/></linearGradient>
    <linearGradient id="barGg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a3e635"/><stop offset="1" stop-color="#4ade80" stop-opacity=".35"/></linearGradient>
    <linearGradient id="barGp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c084fc"/><stop offset="1" stop-color="#7e22ce" stop-opacity=".4"/></linearGradient>
    <linearGradient id="prog" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a3e635"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
