  <text x="56" y="344" font-family="SG" font-size="77.6" font-weight="700" letter-spacing="-2.5" fill="url(#ctl)">every command.</text>

  <!-- lede (max-width 54ch ≈ 486px) -->
  <g font-family="SG" font-size="18.2" fill="#93a7bd">
    <text x="56" y="424">CommandCenter is the terminal-native hub where</text>
    <text x="56" y="454"><tspan fill="#cfe9f7" font-weight="600">your scripts, pipelines and clusters</tspan> report in.</text>
    <text x="56" y="484">Dispatch work in milliseconds, watch it execute live, and</text>
    <text x="56" y="514">keep every environment, service and deploy on one screen.</text>
  </g>

