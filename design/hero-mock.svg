<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="900" viewBox="0 0 1520 900" fill="none">
  <title>CommandCenter hero — design comp (mirrors assets/hero/hero.css at 1520px)</title>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b14"/><stop offset="1" stop-color="#04060b"/>
    </linearGradient>
